# fly.toml app configuration file generated for mazadpay-backend on 2026-05-17T10:06:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mazadpay-backend'
primary_region = 'cdg'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]

[env]
  FIBER_PREFORK = 'false'
  GOGC = '40'
  GOMAXPROCS = '1'
  GOMEMLIMIT = '220MiB'
  PORT = '8082'

[http_service]
  internal_port = 8082
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
